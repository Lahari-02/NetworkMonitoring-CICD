
name: Network Monitoring CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Flask endpoints
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          response = client.get("/")
          assert response.status_code == 200

          response = client.get("/health")
          assert response.status_code == 200
          assert response.get_json()["status"] == "healthy"

          response = client.get("/system")
          assert response.status_code == 200
          assert "operating_system" in response.get_json()

          print("All Flask endpoint tests passed")
          PY

      - name: Build Docker image
        run: docker build -t network-monitoring:test .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lahari1902/network-monitoring:latest
            lahari1902/network-monitoring:${{ github.sha }}
