
name: Network Monitoring CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Flask endpoints
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          response = client.get("/")
          assert response.status_code == 200

          response = client.get("/health")
          assert response.status_code == 200
          assert response.get_json()["status"] == "healthy"

          response = client.get("/system")
          assert response.status_code == 200
          assert "operating_system" in response.get_json()

          print("All Flask endpoint tests passed")
          PY

      - name: Build Docker image
        run: docker build -t network-monitoring:test .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            lahari1902/network-monitoring:latest
            lahari1902/network-monitoring:${{ github.sha }}
      
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/34248954241/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-deployer@netops-monitoring.iam.gserviceaccount.com'

    
     
      - name: Configure Artifact Registry authentication
        if: github.event_name == 'push'
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image to Artifact Registry
        if: github.event_name == 'push'
        run: |
          docker build -t europe-west1-docker.pkg.dev/netops-monitoring/netops-images/network-monitoring:${{ github.sha }} .
          docker push europe-west1-docker.pkg.dev/netops-monitoring/netops-images/network-monitoring:${{ github.sha }}

      - name: Deploy to Google Cloud Run
        if: github.event_name == 'push'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: network-netops-monitoring-app
          region: europe-west1
          image: europe-west1-docker.pkg.dev/netops-monitoring/netops-images/network-monitoring:${{ github.sha }}


